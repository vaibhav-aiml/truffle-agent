# .github/workflows/deploy.yml
name: Test and Deploy to Streamlit Cloud

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests -v

  deploy:
    runs-on: ubuntu-latest
    needs: test  # Deploy only if tests pass
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deploy Client
        run: |
          pip install streamlit

      - name: Deploy to Streamlit
        run: |
          streamlit deploy run_complete_truffle.py
